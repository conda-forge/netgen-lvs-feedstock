context:
  version: "1.5.328"

package:
  name: netgen-lvs
  version: ${{ version }}

source:
  url: https://github.com/RTimothyEdwards/netgen/archive/${{ version }}.tar.gz
  sha256: be30dde15f3f3b3632d35a334d2976abb27d72403b0f93a03ea97285f777eaea

build:
  number: 0
  skip:
    - win
    - osx

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
    - m4
  host:
    - tk
    - xorg-libx11
  run:
    - tk

tests:
  - script:
      # Simple test to verify the binary was linked properly and executes
      - echo "quit" | netgen

about:
  homepage: https://github.com/RTimothyEdwards/netgen
  summary: 'LVS tool for VLSI circuit netlists'
  license: GPL-1.0-only
  license_file: Copying

extra:
  recipe-maintainers:
    - MrAbhi19
