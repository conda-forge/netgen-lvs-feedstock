context:
  version: "1.5.329"

package:
  name: netgen-lvs
  version: ${{ version }}

source:
  url: https://github.com/RTimothyEdwards/netgen/archive/${{ version }}.tar.gz
  sha256: 649400f3a5b872a79c42d4f36d003b32db2bab3503e94117d715abce01f84c4d

build:
  number: 0
  skip:
    - win
    - osx

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
    - m4
  host:
    - tk
    - xorg-libx11
  run:
    - tk

tests:
  - script:
      # Simple test to verify the binary was linked properly and executes
      - echo "quit" | netgen

about:
  homepage: https://github.com/RTimothyEdwards/netgen
  summary: 'LVS tool for VLSI circuit netlists'
  license: GPL-1.0-only
  license_file: Copying

extra:
  recipe-maintainers:
    - MrAbhi19
