context:
  version: "1.5.327"

package:
  name: netgen-lvs
  version: ${{ version }}

source:
  url: https://github.com/RTimothyEdwards/netgen/archive/${{ version }}.tar.gz
  sha256: 9f9e33cf5dbc7a7d0b90a0fb10926f2f1847520248a5f03e129ba7ef61deea7e

build:
  number: 0
  skip:
    - win
    - osx

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
    - m4
  host:
    - tk
    - xorg-libx11
  run:
    - tk

tests:
  - script:
      # Simple test to verify the binary was linked properly and executes
      - echo "quit" | netgen

about:
  homepage: https://github.com/RTimothyEdwards/netgen
  summary: 'LVS tool for VLSI circuit netlists'
  license: GPL-1.0-only
  license_file: Copying

extra:
  recipe-maintainers:
    - MrAbhi19
