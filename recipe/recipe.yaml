context:
  version: "1.5.334"

package:
  name: netgen-lvs
  version: ${{ version }}

source:
  url: https://github.com/RTimothyEdwards/netgen/archive/${{ version }}.tar.gz
  sha256: 943b76f9eec53f27f01457fe079c043872f8d86a2105bc604f2f3666d3d2b965

build:
  number: 0
  skip:
    - win
    - osx

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
    - m4
  host:
    - tk
    - xorg-libx11
  run:
    - tk

tests:
  - script:
      - test -x $PREFIX/bin/netgen
      - test -f $PREFIX/lib/netgen/tcl/tclnetgen.so
      - test -f $PREFIX/lib/netgen/tcl/netgen.tcl

about:
  homepage: https://github.com/RTimothyEdwards/netgen
  summary: 'LVS tool for VLSI circuit netlists'
  license: GPL-1.0-only
  license_file: Copying

extra:
  recipe-maintainers:
    - MrAbhi19
