context:
  version: "1.5.326"

package:
  name: netgen-lvs
  version: ${{ version }}

source:
  url: https://github.com/RTimothyEdwards/netgen/archive/${{ version }}.tar.gz
  sha256: f9de6d592e5409f9d4396268615454b7f3da399fae109eb5b629d0a21aeb8f13

build:
  number: 0
  skip:
    - win
    - osx

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
    - m4
  host:
    - tk
    - xorg-libx11
  run:
    - tk

tests:
  - script:
      # Simple test to verify the binary was linked properly and executes
      - echo "quit" | netgen

about:
  homepage: https://github.com/RTimothyEdwards/netgen
  summary: 'LVS tool for VLSI circuit netlists'
  license: GPL-1.0-only
  license_file: Copying

extra:
  recipe-maintainers:
    - MrAbhi19
